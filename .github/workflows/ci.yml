name: testes

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar pytest + stack de cálculo (numpy/scipy/networkx)
        # H5: os testes unitários da integração (ΔKf) recomputam em fixtures
        # sintéticas minúsculas e exigem o stack de cálculo — numpy (pseudo-
        # inverso do Laplaciano), networkx (grafo + Laplaciano) e scipy
        # (matriz esparsa do laplacian_matrix). São deps CORE do requirements
        # (não o modelo semântico), então a CI segue offline e sem budget.
        run: pip install pytest "numpy>=1.24" "scipy>=1.11" "networkx>=3.0"
      - name: Reconstruir derivados do cache (offline, sem rede / sem budget)
        # PR-5/PR-8: regenera o que falta (ex.: data/author_network.json, gitignored
        # no PR-3) e reconstrói o site SÓ do cache versionado — sem tocar a rede.
        # Mantém tests/test_author_network.py verde num checkout limpo.
        run: python src/run_all.py --offline
      - name: Rodar a suíte
        run: pytest -q

  smoke-offline:
    # PR-8 — "rodar tudo" offline reconstrói os derivados + site e RENDERIZA,
    # sem gastar budget (OA_OFFLINE via --offline). Garante que a cadeia não quebrou.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Playwright
        run: pip install playwright
      - name: Instalar Chromium (+ libs do sistema)
        run: python -m playwright install --with-deps chromium
      - name: Smoke offline — run_all --offline + driver headless
        run: |
          python src/run_all.py --offline
          python .claude/skills/run-scisci-ipea/driver.py
