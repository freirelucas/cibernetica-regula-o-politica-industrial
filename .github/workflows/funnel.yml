# ─────────────────────────────────────────────────────────────────────────────
# funil-rerun — re-execução autônoma do funil pesado (OpenAlex → dados → site).
#
# O QUE FAZ: roda o notebook canônico do Colab
# (colab/scisci_cibernetica_regulacao_PI_v2.ipynb) headless via nbconvert, com o
# MESMO método de crawl/análise — só que as sementes e o vocabulário agora vêm da
# fonte única src/minirun.py (esquema novo 20/20/20; eixo "Reg" = regulação
# econômica). O notebook regenera data/network.json + os checkpoints/CSVs em
# scisci_output/ + escreve data/scisci_results.json (resumo). Em seguida,
# src/run_all.py --offline --force reconstrói os derivados de data/ e o site em
# docs/ a partir desse resumo — SEM crawlar de novo — e a ação abre um PR.
#
# COMO RODAR: manualmente, em Actions → "funil-rerun" → Run workflow
# (workflow_dispatch). Demora horas (crawl real), por isso timeout alto e nunca
# dispara sozinho. O crawl usa o pool polido do OpenAlex (e-mail na célula 2 do
# notebook); a largura é bounded pelos params P do notebook (forward_pages etc.).
#
# NOTA: a célula de montagem (reconstruída a partir do report_builder aposentado)
# faz o notebook escrever data/scisci_results.json — o resumo de 24 chaves
# (corpus, pontes, rajadas, belas adormecidas, clusters, série temporal) a partir
# das análises vivas do funil. UM crawl só: o do notebook. Depois run_all roda
# OFFLINE (--offline, zero fetch) e reconstrói derivados + site a partir do resumo
# fresco, SEM crawlar de novo. Guarda-corpo duro: timeout de 330 min do job. (O
# crawl do notebook usa oa_get próprio, limitado pelos seus params P, não pelo teto.)
# ─────────────────────────────────────────────────────────────────────────────
name: funil-rerun

on:
  # Disparo manual apenas. Sem inputs: a largura do crawl e o e-mail do polite
  # pool vivem nos params P / EMAIL da célula 2 do notebook (ajuste lá se preciso).
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do funil
        run: |
          python -m pip install --upgrade pip
          pip install \
            "python-igraph==0.11.6" \
            "leidenalg==0.10.2" \
            "ipysigma==0.24.6" \
            "pyvis==0.3.2" \
            "plotly>=5.20" \
            "scipy>=1.11" \
            "scikit-learn>=1.3" \
            "pandas>=2.1" \
            "numpy>=1.24" \
            "pyarrow>=14" \
            "requests>=2.31" \
            "tqdm" \
            "nbconvert" \
            "ipykernel" \
            "jupyter"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar o funil pesado (notebook headless)
        # MESMO método do Colab; sementes/vocab vêm de src/minirun (PYTHONPATH=src).
        # ExecutePreprocessor.timeout=-1 = sem teto por célula (o crawl é longo).
        # O notebook usa o pool polido (EMAIL na célula 2); largura nos params P.
        env:
          PYTHONPATH: src
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=-1 \
            --output /tmp/funnel_out.ipynb \
            "colab/scisci_cibernetica_regulacao_PI_v2.ipynb"

      - name: Verificar o resumo regenerado pelo funil
        # A célula de montagem do notebook escreve data/scisci_results.json direto.
        # Falha cedo se faltar ou vier vazio (antes de gastar o run_all).
        run: |
          test -f data/scisci_results.json || { echo "ERRO: o funil não gerou data/scisci_results.json"; exit 1; }
          python3 -c "import json; d=json.load(open('data/scisci_results.json')); print('generated', d['generated'], '| n_seeds', d['n_seeds'], '| corpus', d['corpus_size']); assert d['corpus_size']>0 and d['n_seeds']>0, 'resumo vazio'"

      - name: Reconstruir derivados + site (offline, SEM recrawl)
        # O notebook já fez O ÚNICO crawl (scisci_results.json + network.json).
        # Aqui run_all roda OFFLINE (--offline = zero fetch, só cache) e re-roda
        # as fases p/ reconstruir os derivados de data/ + docs/ a partir do resumo
        # fresco — sem crawlar de novo. Evita o duplo-crawl e o estouro do timeout.
        env:
          PYTHONPATH: src
        run: |
          PYTHONPATH=src python src/run_all.py --offline --force

      - name: Abrir PR com os resultados do funil
        uses: peter-evans/create-pull-request@v6
        with:
          branch: funil-rerun/${{ github.run_id }}
          base: main
          title: "Funil re-run: scisci_results + derivados (auto)"
          commit-message: "Funil re-run automático (workflow funil-rerun)"
          body: |
            Re-execução autônoma do funil pesado pelo workflow **funil-rerun**
            (`.github/workflows/funnel.yml`, disparo manual via workflow_dispatch).

            Produzido por: notebook `colab/scisci_cibernetica_regulacao_PI_v2.ipynb`
            rodado headless (nbconvert) + `src/run_all.py --force`.

            O que pode ter mudado:
            - `data/network.json` e demais derivados em `data/*.json` (run_all).
            - `data/scisci_results.json` — o resumo do relatório, regenerado pelo funil.
            - Site reconstruído em `docs/`.
            - `data/run_all_report.csv` (relatório de execução do DAG).

            Disparo manual (workflow_dispatch). O crawl do notebook usa o pool
            polido (e-mail/params na célula 2); a reconstrução roda offline (sem rede).
